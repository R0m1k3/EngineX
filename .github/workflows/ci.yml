name: ci

on:
  push:
  pull_request:
  # Test de contrat chaque lundi : voir quand une nouvelle version de Codex casse.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Stack valide pour un Docker Compose récent (configs.content de SearXNG).
      - run: docker compose -f docker-compose.yml config -q
      - run: cargo fmt --check
      # Traduction déterministe : clés triées, jamais la feature preserve_order.
      - run: "! cargo tree -e features -i serde_json | grep -q preserve_order"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p enginex-fake-llama
      - run: cargo test --workspace
      - run: npm ci && npm run check && npm run build
        working-directory: web

  # Vrai Codex (dernière version npm) contre EngineX + faux llama-server.
  # N'empêche pas la publication de l'image.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      codex_version: ${{ steps.contract.outputs.codex_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: contract
        run: scripts/contract-codex.sh

  # Bout en bout Docker : vraie devbox (Codex validé par `contract`), vrai
  # docker-socket-proxy, EngineX dans le processus du test, faux llama-server.
  sandbox-e2e:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Devbox (locale)
        uses: docker/build-push-action@v6
        with:
          context: docker/devbox
          load: true
          tags: enginex-devbox:ci
          build-args: CODEX_VERSION=${{ needs.contract.outputs.codex_version }}
          cache-from: type=gha,scope=devbox
          cache-to: type=gha,scope=devbox,mode=max
      - name: Réseau et proxy Docker
        run: |
          docker network create enginex-sandbox-test
          docker run -d --name proxy -p 127.0.0.1:23750:2375 \
            -e CONTAINERS=1 -e IMAGES=1 -e POST=1 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            tecnativa/docker-socket-proxy:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:23750/_ping && break; sleep 1; done
      - name: Navigateur (vrai Chromium de la stack)
        run: |
          docker run -d --name browser --network host --shm-size=1g docker.io/chromedp/headless-shell:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/version && break; sleep 1; done
      - name: Tests du navigateur
        run: |
          ENGINEX_TEST_BROWSER=http://127.0.0.1:9222 cargo test -p enginex-browser -- --ignored --nocapture
          cargo build -p enginex-fake-llama
          ENGINEX_TEST_BROWSER=http://127.0.0.1:9222 cargo test -p enginex-server --test browser -- --ignored --nocapture --test-threads=1
      - run: cargo build -p enginex-fake-llama
      # Le test tourne en uid 1000, comme EngineX en production : la sandbox
      # (uid 1000) lit le jeton et écrit dans le topic.
      - name: Test bout en bout
        run: |
          bin=$(cargo test -p enginex-server --test sandbox_docker --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "sandbox_docker") | .executable')
          sudo chmod o+rx "$HOME" "$HOME/work"
          sudo env ENGINEX_TEST_DOCKER=1 ENGINEX_DEVBOX_IMAGE=enginex-devbox:ci HOME=/tmp \
            setpriv --reuid=1000 --regid=1000 --clear-groups "$bin" --ignored --nocapture --test-threads=1
      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker ps -a
          docker logs proxy 2>&1 | tail -50
          docker logs browser 2>&1 | tail -30
          for c in $(docker ps -aq --filter label=enginex.session); do docker logs "$c" 2>&1 | tail -50; done
          for c in $(docker ps -aq --filter label=enginex.helper); do docker logs "$c" 2>&1 | tail -50; done

  # Publie la devbox avec le Codex validé par `contract` (un contrat rouge
  # bloque la devbox, pas l'image EngineX).
  devbox:
    # Le bout en bout démarre vraiment la devbox : rouge = pas de publication.
    needs: [contract, sandbox-e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deux poussées rapprochées : publications l'une après l'autre (latest = la dernière).
    concurrency:
      group: devbox-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/devbox
          push: true
          tags: ghcr.io/r0m1k3/enginex-devbox:latest
          build-args: CODEX_VERSION=${{ needs.contract.outputs.codex_version }}
          labels: org.opencontainers.image.source=https://github.com/R0m1k3/EngineX
          cache-from: type=gha,scope=devbox

  # Image musl construite et testée sur chaque branche, en parallèle de `test`
  # (une casse du lien statique se voit avant la fusion) ; publiée par `publish`.
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image ghcr.io/r0m1k3/llama-maxwell (moteur Maxwell) copiée par le Dockerfile.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (local, pour le test de fumée)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: enginex:smoke
          build-args: ENGINEX_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de fumée (CPU)
        run: |
          set -eu
          docker run -d --name smoke -p 8090:8090 -v smoke-data:/data enginex:smoke
          fail() { echo "ÉCHEC : $1"; docker logs smoke; exit 1; }
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)
            [ "$s" = healthy ] && break
            [ "$s" = gone ] && fail "conteneur arrêté"
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] || fail "pas healthy en 90 s"
          [ "$(docker exec smoke id -u)" = 1000 ] || fail "uid différent de 1000"
          curl -fsS http://127.0.0.1:8090/api/health | grep -q '"ok":true' || fail "/api/health"
          curl -fsS http://127.0.0.1:8090/api/auth/state | grep -q '"setup_required":true' || fail "/api/auth/state"
          docker logs smoke 2>&1 | grep -q "Code de configuration EngineX" || fail "code de configuration absent des logs"
          # Pas de GPU sur le runner : si --help ne démarre pas sans libcuda, on cherche l'option dans le binaire.
          docker exec smoke sh -c '/app/llama-server --help 2>&1 | grep -q -- --fit-target || grep -aq -- --fit-target /app/llama-server' || fail "llama-server sans --fit"
          docker exec smoke sh -c 'grep -aq maxwell-moe /opt/llama-maxwell/llama-server' || fail "moteur Maxwell absent"
          echo "Test de fumée réussi"

  # Publication : main seulement, après `test` et `image` verts. Tout vient du
  # cache gha rempli par `image` : rien n'est recompilé.
  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/r0m1k3/enginex
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ENGINEX_REVISION=${{ github.sha }}
          cache-from: type=gha
