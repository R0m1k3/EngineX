name: llama-maxwell

# llama-server patché pour Maxwell-V1-Flash : reconstruit seulement quand sa
# recette change (ou à la main). L'image EngineX copie son binaire.
on:
  push:
    paths:
      - docker/llama-maxwell/**
      - .github/workflows/llama-maxwell.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Place disque (image CUDA de compilation)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: docker/llama-maxwell
          push: true
          tags: ghcr.io/r0m1k3/llama-maxwell:b12464
