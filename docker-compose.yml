# Stack EngineX (Portainer ou compose de l'Unraid).
# Premier démarrage : le code de configuration est dans `docker logs enginex`.
services:
  enginex:
    image: ghcr.io/r0m1k3/enginex:latest
    container_name: enginex
    restart: unless-stopped
    init: true
    # Laisse le temps d'arrêter llama-server (15 s au plus) avant SIGKILL.
    stop_grace_period: 30s
    ports:
      # Port de l'hôte réglable (variable ENGINEX_HOST_PORT dans Portainer), 8090 par défaut.
      - "${ENGINEX_HOST_PORT:-8090}:8090"
    environment:
      # true seulement derrière un reverse proxy (voir README).
      ENGINEX_TRUST_PROXY: "false"
    volumes:
      - enginex-data:/data
      # Modèles GGUF (plusieurs dizaines de Go). Sur l'Unraid, un dossier du
      # disque est conseillé : /mnt/user/appdata/enginex/models:/models (voir README).
      - enginex-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  enginex-data:
  enginex-models:
