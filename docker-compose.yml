# Stack EngineX (Portainer ou compose de l'Unraid).
# Premier démarrage : le code de configuration est dans `docker logs enginex`.
services:
  enginex:
    image: ghcr.io/r0m1k3/enginex:latest
    container_name: enginex
    restart: unless-stopped
    init: true
    # Laisse le temps d'arrêter llama-server (15 s au plus) avant SIGKILL.
    stop_grace_period: 30s
    ports:
      # Port de l'hôte réglable (variable ENGINEX_HOST_PORT dans Portainer), 8090 par défaut.
      - "${ENGINEX_HOST_PORT:-8090}:8090"
      # Aperçu des apps des sessions : origine à part, l'app n'atteint pas l'UI.
      # Port de l'hôte réglable (ENGINEX_PREVIEW_HOST_PORT), 8091 par défaut.
      - "${ENGINEX_PREVIEW_HOST_PORT:-8091}:8091"
    environment:
      # true seulement derrière un reverse proxy (voir README).
      ENGINEX_TRUST_PROXY: "false"
      # Sandboxes de session : Docker par le proxy ci-dessous, image devbox.
      ENGINEX_SANDBOX: docker
      ENGINEX_DOCKER_HOST: tcp://docker-proxy:2375
      ENGINEX_DEVBOX_IMAGE: ghcr.io/r0m1k3/enginex-devbox:latest
      ENGINEX_SANDBOX_NETWORK: enginex-sandbox
      ENGINEX_SANDBOX_API_URL: http://enginex:8090/v1
      ENGINEX_SANDBOX_MEMORY: 8g
      # Recherche web de Codex (outil web_search).
      ENGINEX_SEARXNG_URL: http://searxng:8080
      # Port d'aperçu vu par le navigateur (le même que ci-dessus).
      ENGINEX_PREVIEW_PUBLIC_PORT: "${ENGINEX_PREVIEW_HOST_PORT:-8091}"
      # Navigateur piloté par Codex (outils browser_*, fenêtre Regarder).
      ENGINEX_BROWSER_URL: http://browser:9222
    volumes:
      - enginex-data:/data
      # Modèles GGUF (plusieurs dizaines de Go). Sur l'Unraid, un dossier du
      # disque est conseillé : /mnt/user/appdata/enginex/models:/models (voir README).
      - enginex-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      enginex-sandbox:
        aliases: [enginex]
      enginex-docker: {}
      enginex-search: {}
      enginex-browser: {}
    depends_on:
      - docker-proxy
      - searxng
      - browser
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Accès Docker restreint pour EngineX (créer, démarrer, supprimer les
  # sandboxes, tirer l'image) : pas d'exec, de volumes ni de réseaux. Sur un
  # réseau interne que les sandboxes ne joignent pas.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: enginex-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - enginex-docker
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Moteur de recherche de l'outil web_search, joint par EngineX seulement
  # (pas de port publié). Réglages ci-dessous (configs) : format JSON activé,
  # limiteur coupé (il exigerait Valkey).
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: enginex-searxng
    restart: unless-stopped
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    networks:
      - enginex-search
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Chromium sans écran piloté par EngineX en CDP (port 9222, non publié).
  # Profil gardé dans un volume : les connexions aux sites restent.
  browser:
    image: docker.io/chromedp/headless-shell:latest
    container_name: enginex-browser
    restart: unless-stopped
    shm_size: 1gb
    command: ["--user-data-dir=/profile", "--lang=fr-FR", "--window-size=1280,800"]
    volumes:
      - enginex-browser:/profile
    networks:
      - enginex-browser
    labels:
      - com.centurylinklabs.watchtower.enable=true

configs:
  searxng-settings:
    content: |
      use_default_settings: true
      server:
        # Service interne : la clé ne protège que ses cookies.
        secret_key: "${SEARXNG_SECRET:-enginex-searxng-interne-a-changer}"
        limiter: false
        image_proxy: false
      search:
        safe_search: 0
        formats:
          - html
          - json

networks:
  # Réseau des sandboxes (Internet ouvert) ; nom fixe, utilisé par EngineX.
  enginex-sandbox:
    name: enginex-sandbox
  enginex-docker:
    internal: true
  # EngineX ↔ SearXNG (SearXNG a besoin d'Internet pour interroger les moteurs).
  enginex-search: {}
  # EngineX ↔ navigateur (le navigateur sort sur Internet, ne voit ni les
  # sandboxes ni le proxy Docker).
  enginex-browser: {}

volumes:
  enginex-data:
  enginex-models:
  enginex-browser:
