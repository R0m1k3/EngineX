[package]
name = "enginex-hub"
description = "EngineX : Hugging Face, lecture GGUF, réglages conseillés, estimation de VRAM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
