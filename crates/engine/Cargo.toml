[package]
name = "enginex-engine"
description = "EngineX : llama-server (sondes, lancement, supervision, mise à jour)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
enginex-hub = { path = "../hub" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync", "macros", "rt"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
serde_json = "1"
tar = "0.4"
flate2 = "1"
libc = "0.2"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
regex = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
