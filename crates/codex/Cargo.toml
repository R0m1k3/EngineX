[package]
name = "enginex-codex"
description = "Client JSON-RPC de `codex app-server` (WebSocket)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
