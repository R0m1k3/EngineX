<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tâches</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .add { display: flex; gap: 8px; } #new { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2d6a4f; color: #fff; cursor: pointer; }
  #list { list-style: none; padding: 0; } #list li { display: flex; gap: 10px; align-items: flex-start; background: #fff; margin: 8px 0; padding: 12px; border-radius: 8px; overflow-wrap: anywhere; }
  #list li span { flex: 1; min-width: 0; } #list li.done span { text-decoration: line-through; color: #888; }
  .del { background: #b23a48; } .filters { display: flex; gap: 6px; flex-wrap: wrap; } .filters button { background: #555; } .filters button.on { background: #2d6a4f; }
</style>
</head>
<body>
<main>
  <h1>Mes tâches</h1>
  <div class="add"><input id="new" placeholder="Nouvelle tâche"><button id="add">Ajouter</button></div>
  <ul id="list"></ul>
  <p><span id="remaining">0</span> tâche(s) à faire</p>
  <div class="filters"><button id="filter-all" class="on">Toutes</button><button id="filter-active">Actives</button><button id="filter-done">Faites</button></div>
</main>
<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]'), filter = 'all';
  const list = document.getElementById('list'), input = document.getElementById('new');
  const save = () => localStorage.setItem('todos', JSON.stringify(todos));
  function render() {
    list.innerHTML = '';
    todos.forEach((t, i) => {
      const li = document.createElement('li'); if (t.done) li.classList.add('done');
      li.hidden = (filter === 'active' && t.done) || (filter === 'done' && !t.done);
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
      cb.addEventListener('change', () => { t.done = cb.checked; save(); render(); });
      const span = document.createElement('span'); span.textContent = t.text;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Supprimer';
      del.addEventListener('click', () => { todos.splice(i, 1); save(); render(); });
      li.append(cb, span, del); list.append(li);
    });
    document.getElementById('remaining').textContent = todos.filter((t) => !t.done).length;
    for (const f of ['all', 'active', 'done']) document.getElementById('filter-' + f).classList.toggle('on', f === filter);
  }
  function add() { const v = input.value.trim(); if (!v) return; todos.push({ text: v, done: false }); input.value = ''; save(); render(); }
  document.getElementById('add').addEventListener('click', add);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  for (const f of ['all', 'active', 'done']) document.getElementById('filter-' + f).addEventListener('click', () => { filter = f; render(); });
  render();
</script>
</body>
</html>
