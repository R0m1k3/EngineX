<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f3ef; color: #222; }
  main { max-width: 560px; margin: 24px auto; padding: 0 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; } #title { text-transform: capitalize; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
  .grid div { padding: 10px 0; text-align: center; border-radius: 6px; }
  .head { font-weight: 600; font-size: .85rem; } .day { background: #fff; cursor: pointer; } .weekend { background: #ece6dc; }
  .today { outline: 2px solid #c0392b; } .selected { background: #2e86ab; color: #fff; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #444; color: #fff; }
</style>
</head>
<body>
<main>
  <div class="bar"><button id="prev">‹</button><h1 id="title"></h1><button id="next">›</button></div>
  <div class="grid" id="grid"></div>
  <p id="details"></p>
</main>
<script>
  const q = new URLSearchParams(location.search).get('date');
  const today = q && /^\d{4}-\d\d-\d\d$/.test(q) ? new Date(q + 'T12:00:00') : new Date();
  let y = today.getFullYear(), m = today.getMonth();
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  function render() {
    document.getElementById('title').textContent = `${MONTHS[m]} ${y}`;
    const g = document.getElementById('grid'); g.innerHTML = '';
    for (const d of DAYS) { const h = document.createElement('div'); h.className = 'head'; h.textContent = d.slice(0, 3); g.append(h); }
    const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < lead; i++) g.append(document.createElement('div'));
    for (let d = 1; d <= n; d++) {
      const date = new Date(y, m, d), c = document.createElement('div');
      c.className = 'day'; c.dataset.date = iso(date); c.textContent = d;
      if ((date.getDay() + 6) % 7 >= 5) c.classList.add('weekend');
      if (iso(date) === iso(today)) c.classList.add('today');
      c.addEventListener('click', () => {
        g.querySelectorAll('.selected').forEach((e) => e.classList.remove('selected')); c.classList.add('selected');
        document.getElementById('details').textContent = `${DAYS[(date.getDay() + 6) % 7]} ${d} ${MONTHS[m]} ${y}`;
      });
      g.append(c);
    }
  }
  document.getElementById('prev').onclick = () => { m--; if (m < 0) { m = 11; y--; } render(); };
  document.getElementById('next').onclick = () => { m++; if (m > 11) { m = 0; y++; } render(); };
  render();
</script>
</body>
</html>
