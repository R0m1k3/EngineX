<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lampe Halo — Maison Lumière</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><strong>Maison Lumière</strong> <span class="cart">Panier : <span id="cart-count">0</span> article(s) · <span id="cart-total">0,00 €</span></span></header>
  <main class="product">
    <div class="photo" aria-hidden="true"></div>
    <section>
      <h1>Lampe Halo</h1>
      <p class="price">39,90 €</p>
      <p>Lampe à poser en laiton brossé, lumière chaude et douce. Ampoule LED fournie.</p>
      <label>Quantité <input id="qty" type="number" min="1" value="1"></label>
      <button id="add-to-cart" type="button">Ajouter au panier</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
