[package]
name = "enginex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "enginex"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
hashlink = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["mime-guess"] }
regex = "1"
libc = "0.2"
enginex-engine = { path = "../engine" }
enginex-hub = { path = "../hub" }
enginex-oai = { path = "../oai" }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = "0.7"
enginex-codex = { path = "../codex" }
enginex-sandbox = { path = "../sandbox" }
chacha20poly1305 = "0.11"
aho-corasick = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
tar = "0.4"
http-body-util = "0.1"
tempfile = "3"
