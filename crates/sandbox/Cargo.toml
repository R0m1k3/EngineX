[package]
name = "enginex-sandbox"
description = "Sandboxes de session : conteneur Docker ou processus local"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
bollard = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
